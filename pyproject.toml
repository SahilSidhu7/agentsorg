[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsorg"
version = "0.8.5"
description = "A token-efficient virtual company of Claude agents running on your Claude Code subscription."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentsorg = "agentsorg.cli:main"

[tool.setuptools.packages.find]
include = ["agentsorg*"]
exclude = ["agentsorg._attic*"]

[tool.setuptools.package-data]
agentsorg = ["data/*.yaml", "data/blueprints/*.yaml", "data/prompts/*.md", "data/skills/*/*.md", "data/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
